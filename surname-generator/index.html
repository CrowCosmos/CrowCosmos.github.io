<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Random English Surname</title>
<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
  background:#f3f3f3;
  text-align:center;
}
.box{
  max-width:500px;
  margin:40px auto;
  background:white;
  padding:24px;
  border-radius:16px;
}
h1{font-size:28px;margin-top:0}
#name{
  font-size:42px;
  font-weight:bold;
  min-height:60px;
  margin:30px 0;
  word-break:break-word;
}
button{
  display:block;
  width:100%;
  padding:18px;
  margin:12px 0;
  font-size:20px;
  border:0;
  border-radius:12px;
}
#go{background:#2563eb;color:white}
#copy{background:#dddddd;color:black}
small{display:block;margin-top:20px;color:#666}
</style>
</head>
<body>
<div class="box">
<h1>Random English Surname</h1>
<div id="name">Tap Generate</div>

<button id="go" onclick="pickName()">Generate surname</button>
<button id="copy" onclick="copyName()">Copy surname</button>

<small>5,317 surnames included</small>
</div>

<script src="names-a.js"></script>
<script src="names-b.js"></script>
<script src="names-c.js"></script>
<script>
function pickName(){
  var i = Math.floor(Math.random() * surnames.length);
  document.getElementById("name").innerHTML = surnames[i];
}

function copyName(){
  var n = document.getElementById("name").innerText;
  if(!n || n=="Tap Generate") return;

  var t = document.createElement("textarea");
  t.value = n;
  document.body.appendChild(t);
  t.select();

  try{
    document.execCommand("copy");
    document.getElementById("copy").innerHTML = "Copied!";
  }catch(e){
    document.getElementById("copy").innerHTML = "Select name above";
  }

  document.body.removeChild(t);
}
</script>
</body>
</html>
